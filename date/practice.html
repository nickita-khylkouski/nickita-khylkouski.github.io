<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="Name the weekday for dates this year, 1900–2099 or any century, and track your accuracy and speed." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./assets/archivo-DY7AcnAa.woff2" as="font" type="font/woff2" crossorigin />
    <script type="module" crossorigin src="./assets/practice-CEdaUVmq.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/dom-B6LmCMaP.js">
    <link rel="modulepreload" crossorigin href="./assets/quiz-s1y0Lrnn.js">
    <link rel="stylesheet" crossorigin href="./assets/dom-CcVnUONw.css">

  </head>
  <body class="practice">
    <a class="skip-link" href="#panel">Skip to the question</a>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="wordmark" href="./"><img src="./favicon.svg" alt="" width="26" height="26" /><span class="wordmark-text">Doomsday</span></a>
        <nav class="site-nav" aria-label="Main">
          <a href="./">Learn</a>
          <a href="./practice" aria-current="page">Practice</a>
          <a href="./cheatsheet">Cheat sheet</a>
        </nav>
      </div>
    </header>

    <main class="practice-main">
      <div class="practice-top">
        <h1>Practice</h1>
        <div class="top-controls">
          <div class="segmented sets" role="group" aria-label="Which dates" data-widget="sets"></div>
          <button type="button" class="btn quiet rush-btn" data-widget="rush-btn">60 s rush</button>
        </div>
      </div>

      <div class="practice-layout">
        <section class="panel" id="panel" data-widget="panel" tabindex="-1"></section>
        <aside class="board" data-widget="board" aria-label="Your stats"></aside>
      </div>

      <p class="drills" data-widget="drills"></p>

      <p class="keys-help">
        Keyboard: <kbd>0</kbd> to <kbd>6</kbd> answer (Sunday is 0), <kbd>H</kbd> hint, <kbd>W</kbd> show working,
        <kbd>Enter</kbd> next.
      </p>
    </main>

    <footer class="site-footer">
      <p>
        Your scores are saved in this browser and nowhere else. If the method is new to you,
        <a href="./">start with the lesson</a>.
      </p>
    </footer>
